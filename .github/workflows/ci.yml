name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zig:
    uses: nullclaw/nullbuilder/.github/workflows/zig-ci.yml@v1
    permissions:
      contents: read
    with:
      binary_name: nullwatch
      artifact_prefix: nullwatch
      build_args: -Dversion=ci
      e2e_target: linux-x86_64
      e2e_command: bash tests/test_e2e.sh
